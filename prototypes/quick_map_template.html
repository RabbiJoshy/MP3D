<meta charset="utf-8">
<title>Commons Word Space</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: the whole screen is the 3D chamber, with quiet controls floating over Commons-bench green. */
:root{
  --bench:#0d2a23; --bench2:#143a30; --ink:#efece0; --dim:#a7b8ae; --brass:#d9b45f; --line:#2c5145;
  --display:"Bricolage Grotesque","Trebuchet MS",sans-serif; --body:"Source Sans 3","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bench);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;margin:0}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.tl{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:none;border:0;padding:1px 4px;color:var(--ink);
  font:500 12px/1.15 var(--display);white-space:nowrap;text-shadow:0 0 4px var(--bench),0 0 8px var(--bench),0 1px 2px #000;will-change:transform}
.tl:hover,.tl.on{color:var(--brass)}
.tl:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
header{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));width:min(270px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px;pointer-events:none}
header>*{pointer-events:auto}
h1{font:700 24px/1.05 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--dim);margin:0;font-size:13.5px}
#searchwrap{position:relative}
#search{width:100%;box-sizing:border-box;background:var(--bench2);border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:6px;font:inherit}
#results{position:absolute;z-index:5;left:0;right:0;top:100%;margin:2px 0 0;padding:0;list-style:none;background:var(--bench2);border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto}
#results button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:5px 10px;cursor:pointer}
#results button:hover{background:var(--line)}
#results small{color:var(--dim)}
#parties{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bench2);border:1px solid var(--line);border-radius:999px;color:var(--ink);font:12.5px var(--body);padding:2px 8px;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%;display:block}
.chip[aria-pressed=true]{border-color:var(--brass);color:var(--brass)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{background:var(--bench2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 9px;font:13px var(--body);cursor:pointer}
.tool:hover{border-color:var(--brass)}
#panel{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:340px;background:color-mix(in srgb,var(--bench2) 94%,transparent);border:1px solid var(--line);border-radius:10px;padding:16px;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:13px}
#panel h2{font:700 21px/1.1 var(--display);margin:0;text-wrap:balance}
#panel h3{font:600 11.5px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 5px}
.who{display:flex;gap:12px;align-items:center}
.face{width:72px;height:72px;border-radius:50%;flex:none;border:3px solid;background-repeat:no-repeat}
.meta{color:var(--dim);font-size:13.5px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 38px;gap:0 8px;align-items:center;background:none;border:0;padding:2px 0;color:var(--ink);font:13.5px var(--body);width:100%;text-align:left;cursor:pointer}
.bar:hover span:first-child{color:var(--brass)}
.bar em{grid-column:1/3;display:block;height:4px;border-radius:2px;background:var(--brass);margin-top:2px}
.bar b{font-weight:400;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.words{display:flex;flex-wrap:wrap;gap:3px 9px;color:var(--ink);font-size:13.5px}
.mates{display:flex;flex-direction:column}
.mate{background:none;border:0;color:var(--ink);font:13.5px var(--body);display:flex;gap:7px;align-items:center;padding:3px 0;cursor:pointer;text-align:left}
.mate:hover{color:var(--brass)}
.mate i{width:9px;height:9px;border-radius:50%;flex:none}
.mate small{color:var(--dim)}
blockquote{margin:0;border:0;padding:0;font-size:14px}
.src{color:var(--dim);font-size:12.5px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stats div{font-variant-numeric:tabular-nums;font:600 17px var(--display)}
.stats small{display:block;font:12px var(--body);color:var(--dim)}
#close{align-self:flex-end;margin-bottom:-8px}
#tip{position:fixed;display:none;pointer-events:none;background:var(--bench2);border:1px solid var(--line);padding:3px 8px;border-radius:5px;font-size:13px;left:0;top:0;white-space:nowrap}
@media (max-width:760px){
  h1{font-size:19px}.sub{display:none}#parties{max-height:56px;overflow:auto}
  #panel{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:auto;max-height:45%}
  .tl{font-size:10.5px}
}
</style>
<canvas id="stage" aria-label="3D map of MPs. Use search to find an MP."></canvas>
<div id="labels"></div>
<div id="tip"></div>
<header>
  <h1>Commons Word Space</h1>
  <p class="sub">Every MP placed by the words they use in Parliament. Faces close together talk about the same things. Drag to turn, scroll to zoom, click a face or a topic.</p>
  <div id="searchwrap"><input id="search" type="search" placeholder="Find an MP or constituency" autocomplete="off" aria-label="Find an MP or constituency"><ul id="results" hidden></ul></div>
  <div id="parties"></div>
  <div class="tools"><button class="tool" id="reset">Reset view</button><button class="tool" id="faces">Show dots</button><button class="tool" id="spin">Pause spin</button></div>
</header>
<aside id="panel"></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const D=__DATA__;
const ATLAS="__ATLAS__";
const MPS=D.mps,TOPICS=D.topics,N=MPS.length;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct=v=>Math.round(v*100)+"%";

const canvas=$("stage");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0d2a23);
const camera=new THREE.PerspectiveCamera(50,1,.1,200);

const pos=new Float32Array(N*3),tile=new Float32Array(N*2),col=new Float32Array(N*3),scale=new Float32Array(N),glow=new Float32Array(N);
const ts=D.tile/D.size;
MPS.forEach((m,i)=>{
  pos.set(m.x,i*3);
  tile.set([(i%D.cols)*ts,Math.floor(i/D.cols)*ts],i*2);
  const c=new THREE.Color(m.c);col.set([c.r,c.g,c.b],i*3);
  scale[i]=1;glow[i]=1;
});
const geo=new THREE.BufferGeometry();
geo.setAttribute("position",new THREE.BufferAttribute(pos,3));
geo.setAttribute("tile",new THREE.BufferAttribute(tile,2));
geo.setAttribute("col",new THREE.BufferAttribute(col,3));
geo.setAttribute("scale",new THREE.BufferAttribute(scale,1));
geo.setAttribute("glow",new THREE.BufferAttribute(glow,1));
const uniforms={atlas:{value:null},px:{value:1},ts:{value:ts},faces:{value:1},bg:{value:new THREE.Color(0x0d2a23)}};
const mat=new THREE.ShaderMaterial({uniforms,
vertexShader:`attribute vec2 tile;attribute vec3 col;attribute float scale;attribute float glow;
uniform float px;varying vec2 vT;varying vec3 vC;varying float vG;
void main(){vT=tile;vC=col;vG=glow;vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=max(3.,px*scale/-mv.z);}`,
fragmentShader:`uniform sampler2D atlas;uniform float ts;uniform float faces;uniform vec3 bg;varying vec2 vT;varying vec3 vC;varying float vG;
void main(){vec2 p=gl_PointCoord;float d=length(p-.5);if(d>.5)discard;
vec3 c=(d>.42||faces<.5)?vC:texture2D(atlas,vT+p*ts).rgb;
gl_FragColor=vec4(mix(bg,c,vG),1.);}`});
const points=new THREE.Points(geo,mat);points.frustumCulled=false;scene.add(points);
const img=new Image();img.onload=()=>{const t=new THREE.Texture(img);t.flipY=false;t.minFilter=THREE.LinearMipmapLinearFilter;t.needsUpdate=true;uniforms.atlas.value=t;};img.src=ATLAS;

// Topic labels sit where the MPs most devoted to each topic gather
const centres=TOPICS.map((_,k)=>{let w=0,c=[0,0,0];MPS.forEach(m=>{const a=Math.pow(m.s[k],3);w+=a;c=c.map((v,j)=>v+m.x[j]*a);});return new THREE.Vector3(c[0]/w,c[1]/w,c[2]/w);});
const labels=TOPICS.map((t,k)=>{const b=document.createElement("button");b.className="tl";b.textContent=t;b.onclick=()=>selectTopic(k);$("labels").append(b);return b;});

let az=.6,el=.25,dist=25,distTo=25,target=new THREE.Vector3(),targetTo=new THREE.Vector3(),spin=!reduce;
let sel=null,topicSel=null,soloParty=null,hover=-1;
const v=new THREE.Vector3();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();uniforms.px.value=h*1.0*Math.min(devicePixelRatio,2)/ (2*Math.tan(25*Math.PI/180))*.62;}
addEventListener("resize",resize);resize();

function project(p){v.copy(p).project(camera);return{x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight,z:v.z};}
function refresh(){
  for(let i=0;i<N;i++){const m=MPS[i];let g=1,s=1;
    if(soloParty&&m.p!==soloParty)g=.1;
    if(topicSel!=null){const a=Math.min(1,m.s[topicSel]/.35);s=.55+a*1.7;g=Math.min(g,.1+Math.min(1,a*1.6)*.9);}
    if(sel!=null){const related=MPS[sel].nn.includes(i);if(i===sel){s=2.6;g=1;}else if(related){s=1.4;g=1;}else{g=Math.min(g,.28);s=Math.min(s,.8);}}
    scale[i]=s;glow[i]=g;}
  geo.attributes.scale.needsUpdate=true;geo.attributes.glow.needsUpdate=true;
}
function hoverAt(x,y){let best=-1,bd=1e9;const r=uniforms.px.value/Math.min(devicePixelRatio,2);
  for(let i=0;i<N;i++){const p=project(new THREE.Vector3(pos[i*3],pos[i*3+1],pos[i*3+2]));if(p.z>1)continue;
    const depth=camera.position.distanceTo(new THREE.Vector3(pos[i*3],pos[i*3+1],pos[i*3+2]));
    const rad=Math.max(5,r*scale[i]/depth/2);const d=Math.hypot(p.x-x,p.y-y);
    if(d<rad&&glow[i]>.2&&depth<bd){bd=depth;best=i;}}
  return best;}

function faceStyle(i){const s=72/D.tile,cx=(i%D.cols)*D.tile*s,cy=Math.floor(i/D.cols)*D.tile*s;return `background-image:url(${ATLAS_URL});background-size:${D.size*s}px;background-position:-${cx}px -${cy}px;border-color:${MPS[i].c}`;}
let ATLAS_URL=ATLAS;
const panel=$("panel");
function closeBtn(){return `<button class="tool" id="close">Close</button>`;}
function intro(){panel.innerHTML=`<div><h3>What you're looking at</h3><h2>${N} MPs, 30 topics, no labels given</h2></div>
<p style="margin:0">Each face is an MP, placed only by their word use in Hansard since July 2024. Nothing told the model about parties or subjects. The topic names were added afterwards, by reading each topic's top words.</p>
<div><h3>Try these</h3><div class="mates">${[["Nigel Farage"],["Kim Leadbeater"],["Rachel Reeves"],["Jim Shannon"],["Zarah Sultana"],["Kemi Badenoch"]].map(([n])=>{const i=MPS.findIndex(m=>m.n.includes(n));return i<0?"":`<button class="mate" data-mp="${i}"><i style="background:${MPS[i].c}"></i>${esc(MPS[i].n)} <small>${esc(MPS[i].p)}</small></button>`;}).join("")}</div></div>
<div><h3>Read it with care</h3><p style="margin:0" class="meta">This is a rough demo built in seconds from word counts, using up to 150 passages per MP. It shows what people talk about far better than where they stand. Ministers mostly sit by their department, because that's what they have to discuss. Distances between faraway groups mean little.</p></div>`;wire();}
function wire(){panel.querySelectorAll("[data-mp]").forEach(b=>b.onclick=()=>selectMP(+b.dataset.mp));panel.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>selectTopic(+b.dataset.topic));const c=$("close");if(c)c.onclick=clearAll;}
function selectMP(i){sel=i;topicSel=null;spin=false;syncSpin();const m=MPS[i];targetTo.set(...m.x);distTo=Math.min(distTo,17);
  const max=m.t[0][1];
  panel.innerHTML=`${closeBtn()}<div class="who"><div class="face" style="${faceStyle(i)}"></div><div><h2>${esc(m.n)}</h2><div class="meta">${esc(m.pn)}<br>${esc(m.k)}</div></div></div>
<div class="stats"><div>${(m.words/1000).toFixed(0)}k<small>words spoken</small></div>${m.v?`<div>${m.v[0]}<small>votes cast</small></div><div>${m.v[1]}<small>against own party</small></div>`:`<div>–<small>votes cast</small></div><div>–<small>against own party</small></div>`}</div>
<div><h3>Topics that light up</h3>${m.t.filter(([,s])=>s>=.01).map(([k,s])=>`<button class="bar" data-topic="${k}"><span>${esc(TOPICS[k])}</span><b>${pct(s)}</b><em style="width:${Math.max(3,s/max*100)}%"></em></button>`).join("")}</div>
<div><h3>Words that set them apart</h3><div class="words">${m.w.map(esc).join(" · ")}</div></div>
<div><h3>In their words</h3><blockquote>${esc(m.q)}</blockquote><div class="src">${esc(m.qd)}. Lightly cleaned for this map.</div></div>
<div><h3>Closest MPs by topics</h3><div class="mates">${m.nn.map(j=>`<button class="mate" data-mp="${j}"><i style="background:${MPS[j].c}"></i>${esc(MPS[j].n)} <small>${esc(MPS[j].p)}</small></button>`).join("")}</div></div>
${m.min>.2?`<p class="meta" style="margin:0">${pct(m.min)} of this text was spoken while holding a government post, so it partly reflects the job.</p>`:""}`;
  wire();refresh();panel.scrollTop=0;}
function selectTopic(k){topicSel=k;sel=null;spin=false;syncSpin();targetTo.copy(centres[k]);distTo=Math.min(distTo,20);
  const top=MPS.map((m,i)=>[m.s[k],i]).sort((a,b)=>b[0]-a[0]).slice(0,10);
  const counts={};top.forEach(([,i])=>counts[MPS[i].p]=(counts[MPS[i].p]||0)+1);
  panel.innerHTML=`${closeBtn()}<div><h3>Topic</h3><h2>${esc(TOPICS[k])}</h2></div>
<div><h3>Its top words</h3><div class="words">${D.terms[k].map(esc).join(" · ")}</div></div>
<div><h3>Who talks about this most</h3><div class="mates">${top.map(([s,i])=>`<button class="mate" data-mp="${i}"><i style="background:${MPS[i].c}"></i>${esc(MPS[i].n)} <small>${esc(MPS[i].p)} · ${pct(s)} of their topic mix</small></button>`).join("")}</div></div>`;
  wire();refresh();panel.scrollTop=0;}
function clearAll(){sel=null;topicSel=null;targetTo.set(0,0,0);distTo=25;intro();refresh();}

// party filter
const counts={};MPS.forEach(m=>{(counts[m.p]=counts[m.p]||{n:0,c:m.c,name:m.pn}).n++;});
Object.entries(counts).sort((a,b)=>b[1].n-a[1].n).forEach(([p,o])=>{if(o.n<2&&p!=="Green")return;const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed","false");b.title=o.name;b.innerHTML=`<i style="background:${o.c}"></i>${esc(p)} ${o.n}`;
  b.onclick=()=>{soloParty=soloParty===p?null:p;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));if(soloParty)b.setAttribute("aria-pressed","true");refresh();};$("parties").append(b);});

// search
const search=$("search"),results=$("results");
search.oninput=()=>{const q=search.value.trim().toLowerCase();if(q.length<2){results.hidden=true;return;}
  const hit=MPS.map((m,i)=>[m,i]).filter(([m])=>m.n.toLowerCase().includes(q)||m.k.toLowerCase().includes(q)).slice(0,8);
  results.innerHTML=hit.length?hit.map(([m,i])=>`<li><button data-mp="${i}">${esc(m.n)} <small>${esc(m.p)} · ${esc(m.k)}</small></button></li>`).join(""):`<li style="padding:5px 10px" class="meta">No MP on the map matches that.</li>`;results.hidden=false;
  results.querySelectorAll("button").forEach(b=>b.onclick=()=>{selectMP(+b.dataset.mp);results.hidden=true;search.value="";});};

$("reset").onclick=clearAll;
$("faces").onclick=e=>{const on=uniforms.faces.value>.5;uniforms.faces.value=on?0:1;e.target.textContent=on?"Show faces":"Show dots";};
function syncSpin(){$("spin").textContent=spin?"Pause spin":"Spin";}
$("spin").onclick=()=>{spin=!spin;syncSpin();};syncSpin();
addEventListener("keydown",e=>{if(e.key==="Escape")clearAll();});

// orbit
const pointers=new Map();let moved=0,pinch=0;
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);moved=0;canvas.classList.add("drag");});
canvas.addEventListener("pointermove",e=>{
  if(pointers.has(e.pointerId)){const[px,py]=pointers.get(e.pointerId);const dx=e.clientX-px,dy=e.clientY-py;pointers.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
    if(pointers.size===1){az-=dx*.006;el=Math.max(-1.45,Math.min(1.45,el+dy*.006));if(moved>5)spin=false,syncSpin();}
    else if(pointers.size===2){const[a,b]=[...pointers.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)distTo=Math.max(4,Math.min(55,distTo*pinch/d));pinch=d;}
    $("tip").style.display="none";return;}
  hover=hoverAt(e.clientX,e.clientY);const tip=$("tip");
  if(hover>=0){tip.textContent=MPS[hover].n+" · "+MPS[hover].p;tip.style.display="block";tip.style.transform=`translate(${Math.min(e.clientX+12,innerWidth-200)}px,${e.clientY+12}px)`;canvas.style.cursor="pointer";}
  else{tip.style.display="none";canvas.style.cursor="";}
});
const up=e=>{const was=pointers.size;pointers.delete(e.pointerId);pinch=0;canvas.classList.remove("drag");
  if(was===1&&moved<6){const h=hoverAt(e.clientX,e.clientY);if(h>=0)selectMP(h);}};
canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",e=>{pointers.delete(e.pointerId);pinch=0;});
canvas.addEventListener("wheel",e=>{e.preventDefault();distTo=Math.max(4,Math.min(55,distTo*Math.exp(e.deltaY*.0012)));},{passive:false});

const lp=new THREE.Vector3();
function frame(){requestAnimationFrame(frame);
  if(spin)az+=.0016;
  target.lerp(targetTo,.08);dist+=(distTo-dist)*.08;
  camera.position.set(target.x+dist*Math.cos(el)*Math.sin(az),target.y+dist*Math.sin(el),target.z+dist*Math.cos(el)*Math.cos(az));
  camera.lookAt(target);camera.updateMatrixWorld();
  const active=sel!=null?new Map(MPS[sel].t.map(([k,s])=>[k,s])):null;
  centres.forEach((c,k)=>{const b=labels[k];lp.copy(c);const p=project(lp);const depth=camera.position.distanceTo(c);
    let o=Math.max(.3,Math.min(1,1.25-depth/(dist*1.5)));
    if(active){o=active.has(k)?1:.08;}
    if(topicSel!=null)o=k===topicSel?1:.12;
    const off=p.z>1;b.style.display=off?"none":"";if(off)return;
    b.style.opacity=o;b.style.pointerEvents=o<.2?"none":"auto";b.classList.toggle("on",(active&&active.has(k))||topicSel===k);
    b.style.transform=`translate(${Math.round(p.x)}px,${Math.round(p.y)}px) translate(-50%,-50%)`;});
  renderer.render(scene,camera);}
intro();refresh();frame();
</script>
