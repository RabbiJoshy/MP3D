<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Where Do You Stand?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* One screen: the map of MPs (2D or 3D) on the left, the panel on the right walks you through a few questions and then shows your matches. */
:root{--bench:#0a211b;--bench2:#143a30;--ink:#efece0;--dim:#a7b8ae;--brass:#d9b45f;--line:#2c5145;--yes:#8fd694;--no:#e58e7a;--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Source Sans 3","Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bench);color:var(--ink);font:15px/1.45 var(--body)}
.wrap{max-width:1280px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:700 26px/1.05 var(--display);margin:0}
h2{font:700 19px/1.15 var(--display);margin:0 0 8px}
h3{font:600 11.5px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 6px}
p{margin:0}
.meta{color:var(--dim);font-size:13.5px}
.app{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;margin-top:14px;align-items:start}
.mapcard{position:sticky;top:12px;background:var(--bench2);border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.maptop{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 2px 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--ink);padding:5px 14px;font:600 13.5px var(--body);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--brass);color:#14241e}
canvas{display:block;width:100%;border-radius:8px;touch-action:pan-y;cursor:default}
canvas.orbit{touch-action:none;cursor:grab}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--dim);padding:8px 4px 2px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bench);padding:5px 9px;border-radius:6px;font-size:13px;z-index:9;display:none;max-width:260px}
.panel{background:var(--bench2);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.big{font:700 22px/1.2 var(--display);text-wrap:balance}
.chip{display:inline-block;background:var(--bench);border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:13px;color:var(--brass);font-weight:600}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--brass);transition:width .3s}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ch{background:var(--bench);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:12px;font:600 15px var(--body);cursor:pointer;text-align:left}
.ch:hover{border-color:var(--brass)}
.ch[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:#14241e}
.ch.y::before,.ch.n::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px}
.ch.y::before{background:var(--yes)}.ch.n::before{background:var(--no)}
.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--brass);border:0;border-radius:8px;color:#14241e;padding:11px 18px;font:700 15px var(--body);cursor:pointer}
.btn[disabled]{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--brass);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font:inherit}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.mapcard .maptop{position:relative}
.ibtn{background:var(--bench);border:1px solid var(--line);border-radius:999px;color:var(--ink);width:32px;height:32px;display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn[aria-expanded=true],.ibtn.on{border-color:var(--brass);color:var(--brass)}
.fpop{position:absolute;right:10px;top:50px;z-index:4;background:#0f2c24;border:1px solid var(--line);border-radius:12px;padding:12px;width:min(300px,calc(100% - 20px));display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.tpop{width:min(380px,calc(100% - 20px));max-height:70vh;overflow:auto}
.tsub{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}.tsub:first-of-type{border-top:0;padding-top:0}
.tsub>button{background:none;border:0;padding:0;color:var(--brass);font:700 15px var(--display);text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px}
.tsub>button small{font:600 11px var(--body);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.chips button.on{border-color:var(--brass);color:var(--brass)}
.tcap{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(10,33,27,.92);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px 12px;align-items:start;font-size:13px;animation:up .4s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tcap h4{margin:0 0 3px;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase}
.tcap .nm{background:none;border:0;padding:0;color:var(--ink);cursor:pointer;font:inherit;display:block;text-align:inherit}.tcap .nm:hover{color:var(--brass)}
.tcap .mid{text-align:center;color:var(--dim);max-width:200px}.tcap .mid b{display:block;color:var(--ink);font:700 14px var(--display)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{background:var(--bench);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:4px 10px;font:600 13px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chips button[aria-pressed=false]{opacity:.4;text-decoration:line-through}
.chips i{width:9px;height:9px;border-radius:50%;display:inline-block}
.near{display:grid;grid-template-columns:18px 10px minmax(0,1fr) 90px;gap:2px 8px;align-items:center;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);text-align:left;padding:7px 0;cursor:pointer;font:inherit;width:100%}
.near:hover .nm{color:var(--brass)}.near i{width:10px;height:10px;border-radius:50%;display:block}.near .k{color:var(--dim);font-size:13px;font-variant-numeric:tabular-nums}
.modes{align-self:flex-start}.modes button{padding:7px 16px;font-size:14px}
.pick{display:grid;gap:10px}.pick button{text-align:left;background:var(--bench);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:14px;cursor:pointer;font:inherit}.pick button:hover{border-color:var(--brass)}.pick b{display:block;font:700 18px var(--display);margin-bottom:3px}
.mat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;align-items:center}
.mat .seg button{padding:5px 10px;font-size:13px}
.split{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}.split i{display:block;height:100%}
.mp{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 10px;align-items:baseline;background:none;border:0;border-top:1px solid var(--line);color:var(--ink);text-align:left;padding:8px 0;cursor:pointer;font:inherit;width:100%}
.mp:hover .nm{color:var(--brass)}
.mp i{width:10px;height:10px;border-radius:50%;display:block;margin-top:5px}
.mp b{font-weight:400;font-variant-numeric:tabular-nums}
.mp small{grid-column:2/4;color:var(--dim);font-size:12.5px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%}
.party{display:grid;grid-template-columns:52px minmax(0,1fr) 80px;gap:8px;align-items:center;font-size:13.5px}
.ev{border-left:3px solid var(--line);padding-left:10px;margin:6px 0}.ev.yes{border-color:var(--yes)}.ev.no{border-color:var(--no)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:1px 7px;border-radius:999px;margin-right:6px}
.tag.yes{background:var(--yes);color:#10201b}.tag.no{background:var(--no);color:#10201b}.tag.none{background:var(--line);color:var(--ink)}
.more{display:flex;flex-wrap:wrap;gap:6px}
.more button{background:var(--bench);border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:5px 12px;font:600 13px var(--body);cursor:pointer}
.ans{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;font-size:13.5px;border:0;border-top:1px solid var(--line);padding:6px 0;background:none;color:var(--ink);text-align:left;width:100%;cursor:pointer;font-family:inherit}
.card{background:var(--bench2);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;margin-top:22px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{padding:4px 6px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600}
.num{font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow-x:auto}
[hidden]{display:none!important}
@media (max-width:860px){.app{grid-template-columns:1fr;gap:10px}.mapcard{position:static;padding:6px}.panel{padding:14px;gap:12px}h1{font-size:21px}.big{font-size:19px}.legend{font-size:12px}.ch{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Where do you stand?</h1><p class="meta" id="hdr"></p></header>
  <div class="app">
    <div class="mapcard">
      <div class="maptop"><div class="seg" role="group" aria-label="Map view"><button data-dim="2" aria-pressed="true">2D</button><button data-dim="3" aria-pressed="false">3D</button></div><span style="display:flex;gap:10px;align-items:center"><span class="meta" id="hint"></span><button class="ibtn" id="tbtn" aria-label="Show a topic's line or plane" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button><button class="ibtn" id="fbtn" aria-label="Filter the map" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v2.2a2 2 0 0 1-.6 1.4L15 12v7l-6 2v-8.5L4.5 7.6A2 2 0 0 1 4 6.2z"/></svg></button></span></div>
      <div class="fpop" id="fpop" hidden></div><div class="fpop tpop" id="tpop" hidden></div>
      <div style="position:relative"><canvas id="map" role="img" aria-label="Map of MPs placed by what they said in Parliament"></canvas><div class="tcap" id="tcap" hidden></div></div>
      <div class="legend" id="legend"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;min-width:0"><div class="seg modes" role="group" aria-label="Mode" id="modes"><button data-mode="stand">Where I stand</button><button data-mode="care">What I care about</button></div>
    <section class="panel" id="panel" aria-live="polite"></section></div>
  </div>
  <section class="card" id="checks" hidden></section>
</div>
<div class="tip" id="tip"></div>
<script>
const D=__DATA__;const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SB=D.subjects,M=D.mps,SP=D.space,P=SB.flatMap(S=>S.proposals.map(p=>({...p,s:S})));
const byK=Object.fromEntries(P.map(p=>[p.k,p]));
let ans={},imp={};try{const s=JSON.parse(localStorage.getItem("wdys2")||"{}");ans=s.ans||{};imp=s.imp||{};}catch(e){}
const save=()=>{try{localStorage.setItem("wdys2",JSON.stringify({ans,imp}))}catch(e){}};
let view="intro",Q=[],qi=0,sel=null;
const wt=k=>1;   // placement treats every issue the same; what you care about is its own mode
const care=k=>{const v=imp[k];return v==null?0:+v;};   // how much a subject matters to you: 0, 1 or 2
let mode="stand";
let FILT={mps:true,avg:true,arrows:true,names:true,hid:{}};try{Object.assign(FILT,JSON.parse(localStorage.getItem("wdysf")||"{}"))}catch(e){}
const saveF=()=>{try{localStorage.setItem("wdysf",JSON.stringify(FILT))}catch(e){}};
const shown=m=>FILT.mps&&!FILT.hid[m.p];
const PCOL=Object.fromEntries(M.map(m=>[m.p,m.c]));
// Nearest neighbours in the learned space: distance between you and each MP, with each axis scaled by how spread out MPs are along it
const SD=[0,1,2].map(i=>Math.sqrt(SP.prior[i][i]));let YZ=SP.m0.slice();
const dist=(a,b)=>Math.sqrt(a.reduce((s,v,i)=>s+((v-b[i])/SD[i])**2,0));
function nearest(){return M.map(m=>({m,d:dist([m.x,m.y,m.z],YZ)})).sort((a,b)=>a.d-b.d);}
// Who talks most about the subjects you care about: weighted share of everything they said, ignoring MPs who said little on them
function talkers(){const ks=SB.map(S=>S.k).filter(k=>care(k)>0),W=ks.reduce((a,k)=>a+care(k),0);if(!W)return[];
  return M.map(m=>{let sc=0,n=0;ks.forEach(k=>{const a=m.att[k];if(a){sc+=care(k)*a[1];n+=a[0];}});return{m,sc:sc/W,n};}).filter(x=>x.n>=8).sort((a,b)=>b.sc-a.sc);}
const answered=()=>P.filter(p=>ans[p.k]!=null&&ans[p.k]!=="u"&&wt(p.k)>0);
const cur=()=>view==="quiz"?Q[qi]:null;

// ---------- the map: one 3D scene; 2D is the same scene seen straight on ----------
const cv=$("map"),cx=cv.getContext("2d");
const rng=a=>{const s=[...a].sort((x,y)=>x-y);return[s[Math.floor(s.length*.01)],s[Math.ceil(s.length*.99)-1]];};
const R3=["x","y","z"].map(a=>rng(M.map(m=>m[a])));
const nrm=(v,i)=>((v-R3[i][0])/(R3[i][1]-R3[i][0]))*2-1;
const pts=M.map(m=>({m,p:[nrm(m.x,0),nrm(m.y,1),nrm(m.z,2)]}));
// Each proposal's direction: where supporting it moves you, in the map's units. Longest arrow reaches most of the way out.
const ORIGIN=SP.m0.map((v,i)=>nrm(v,i));
const ARR=(()=>{const r=SP.keys.map((k,j)=>({k,d:SP.W[j].map((w,i)=>w*2/(R3[i][1]-R3[i][0]))}));r.forEach(x=>x.n=Math.hypot(...x.d));const mx=Math.max(...r.map(x=>x.n));r.forEach(x=>x.d=x.d.map(v=>v*.8/mx));return r.sort((a,b)=>b.n-a.n);})();
// For the overview, the strongest ideas pointing in clearly different directions (either end of an idea counts)
// A topic as geometry in the shared space: one proposal is a line through the centre (for at one end, against at the other);
// a subject is the plane spanned by its two strongest, most different proposal directions
let TOPIC=null;
const unit=v=>{const n=Math.hypot(...v);return v.map(x=>x/n);},dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const mixc=t=>{const a=t<0?[229,142,122]:[143,214,148],n=[120,140,132],u=Math.min(1,Math.abs(t));return`rgb(${n.map((v,i)=>Math.round(v+(a[i]-v)*u)).join(",")})`;};
function setTopic(kind,k){if(!k||(TOPIC&&TOPIC.k===k)){TOPIC=null;$("tcap").hidden=true;dirty=true;drawTopics();return;}
  const S=kind==="plane"?SB.find(x=>x.k===k):null,vs=(kind==="line"?[ARR.find(x=>x.k===k)]:S.proposals.map(p=>ARR.find(x=>x.k===p.k))).filter(Boolean).sort((a,b)=>b.n-a.n);
  const e1=unit(vs[0].d);let e2=null,k2=null;
  if(kind==="plane"){let bn=0;vs.slice(1).forEach(v=>{const o=v.d.map((x,i)=>x-dot3(v.d,e1)*e1[i]),n=Math.hypot(...o);if(n>bn){bn=n;e2=unit(o);k2=v.k;}});}
  const keys=kind==="line"?[k]:S.proposals.map(p=>p.k),rel=new Set(M.filter(m=>keys.some(q=>m.positions[q]&&Math.abs(m.positions[q].s)>.2)).map(m=>m.i));
  const pr=new Map(pts.map(o=>[o.m.i,dot3(o.p.map((v,i)=>v-ORIGIN[i]),e1)]));const vmax=Math.max(...[...pr.values()].map(Math.abs));
  // ends: for one proposal, MPs who said they support it (or oppose it), furthest along the line; for a subject, furthest along its main direction
  const said=(m,sg)=>kind!=="line"||(m.positions[k]&&Math.sign(m.positions[k].s)===sg);
  const forEnd=M.filter(m=>rel.has(m.i)&&said(m,1)).sort((a,b)=>pr.get(b.i)-pr.get(a.i)).slice(0,3),agEnd=M.filter(m=>rel.has(m.i)&&said(m,-1)).sort((a,b)=>pr.get(a.i)-pr.get(b.i)).slice(0,3);
  // how much each MP talked about it: passages on this proposal, or on any of the subject's proposals
  const talk=new Map(M.map(m=>[m.i,kind==="line"?(m.ap[k]||0):((m.att[k]||[0])[0])]));const tmax=Math.max(1,...talk.values());
  TOPIC={kind,k,e1,e2,k1:vs[0].k,k2,t0:performance.now(),rel,pr,vmax,talk,tmax};
  const nm=m=>`<button class="nm" data-mp="${m.i}"><span style="color:${m.c}">●</span> ${esc(m.n)} <span class="meta">${esc(m.p)}</span></button>`;
  $("tcap").innerHTML=`<div><h4 style="color:var(--no)">${kind==="line"?"Said against, furthest out":"Furthest toward against"}</h4>${agEnd.map(nm).join("")}</div>
    <div class="mid"><b>${kind==="line"?esc(byK[k].short):esc(S.title)}</b>${kind==="line"?"a line through the space":"a plane through the space"} · bigger bubbles talked about it more<br><button class="link" data-topic="">Close</button></div>
    <div style="text-align:right"><h4 style="color:var(--yes)">${kind==="line"?"Said for, furthest out":"Furthest toward for"}</h4>${forEnd.map(nm).join("")}</div>`;
  $("tcap").hidden=false;if(kind==="plane"&&dim===2)setDim(3);dirty=true;drawTopics();}
function drawTopics(){$("tpop").innerHTML=`<p class="meta" style="margin:0">A subject is a plane through the space; one proposal is a line. Pick one to see where it lies and who sits at each end.</p>`+SB.map(S=>`<div class="tsub"><button data-topic="${S.k}" data-kind="plane">${esc(S.title)} <small>plane</small></button><div class="chips">${S.proposals.map(p=>`<button data-topic="${p.k}" data-kind="line" class="${TOPIC&&TOPIC.k===p.k?"on":""}">${esc(p.short)}</button>`).join("")}</div></div>`).join("");
  $("tbtn").classList.toggle("on",!!TOPIC);}
const SPREAD=(()=>{const out=[];ARR.forEach(x=>[1,-1].forEach(sg=>{const an=Math.atan2(-sg*x.d[1],sg*x.d[0]);if(out.length<7&&out.every(o=>{const d=Math.abs(((o.an-an+3*Math.PI)%(2*Math.PI))-Math.PI);return d>.6;})&&!out.some(o=>o.k===x.k))out.push({...x,sg,an});}));return out;})();
let cam={yaw:0,pitch:0},goal={yaw:0,pitch:0},dim=2,you=[0,0,0],youGoal=[0,0,0],halo=1,haloGoal=1,dirty=true,W0=0,H0=0;
let drag=null,spunByUser=false;
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;W0=r.width;H0=Math.min(r.width*.78,innerWidth<=860?innerHeight*.42:innerHeight*.72);cv.style.height=H0+"px";cv.width=W0*d;cv.height=H0*d;cx.setTransform(d,0,0,d,0,0);dirty=true;}
function proj(p){const[x,y,z]=p,cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);
  const x1=x*cy+z*sy,z1=-x*sy+z*cy,y1=y*cp-z1*sp,z2=y*sp+z1*cp,f=dim===3?3.2/(3.2-z2):1,s=Math.min(W0*.42,H0*.56)*(dim===3?.8:1);
  return[W0/2+x1*s*f*(dim===3?1:W0*.44/s),H0/2-y1*s*f*(dim===3?1:H0*.42/s),z2,f];}
const endLab=(a,sgn)=>SP[a][sgn].slice(0,2).map(k=>byK[k].short).join(", ");
function outlined(t,x,y,col){cx.strokeText(t,x,y);cx.fillStyle=col;cx.fillText(t,x,y);}
let CS=null,CSmax=1;
function draw(){cx.clearRect(0,0,W0,H0);const q=cur(),T=mode==="care"?talkers():null;CS=T&&T.length?new Map(T.map(x=>[x.m.i,x.sc])):null;CSmax=T&&T.length?T[0].sc:1;
  const top=mode==="care"?(T||[]).slice(0,5).map(x=>x.m.i):view==="results"&&sel==null&&answered().length?nearest().slice(0,5).map(x=>x.m.i):[];

      ${Object.keys(m.att).length?`<p class="meta">Share of what they said, by issue: ${SB.filter(S=>m.att[S.k]).sort((a,b)=>m.att[b.k][1]-m.att[a.k][1]).map(S=>`${esc(S.title)} ${(m.att[S.k][1]*100).toFixed(1)}%`).join(" · ")}</p>`:""}
      ${answered().length?`<p class="meta">Where you both have a position: agree on ${cmp.agree}, disagree on ${cmp.disagree}. Not speaking on something isn't the same as being neutral.</p>`:""}
      ${SB.filter(S=>S.proposals.some(p=>m.positions[p.k])).map(S=>`<h3 style="margin-top:4px">${esc(S.title)}</h3>`+S.proposals.filter(p=>m.positions[p.k]).map(p=>{const pos=m.positions[p.k],[cls,word]=side(pos.s),mine=ans[p.k];
        return `<div><p style="font-weight:600">${esc(p.label)}</p><p><span class="tag ${cls}">${word}</span><span class="meta">${pos.debates} debate${pos.debates>1?"s":""}${pos.minister?", some as a minister":""}${mine&&mine!=="u"?` · you ${+mine>0?"support":"oppose"} it`:""}</span></p>${pos.ev.slice(0,2).map(e=>`<div class="ev ${e.side>0?"yes":"no"}"><p style="font-size:14px">${esc(e.t)}</p><p class="meta">${esc(e.d)}</p></div>`).join("")}</div>`;}).join("")).join("")}`;}
  else{const done=answered();
    if(!done.length){R.innerHTML=`<p class="big">You haven't taken a side yet, so you're sitting in the middle.</p><div class="row"><button class="btn" data-go="stand">Start</button></div>`;paint();return;}
    const rk=ranked(),z=placeYou(),full=a=>(M.find(m=>m.p===a)||{}).pn||a;
    const near=SP.parties.filter(p=>p.n>=4&&p.p!=="Ind").map(p=>({...p,d:Math.hypot(p.x-z[0],p.y-z[1],p.z-z[2])})).sort((a,b)=>a.d-b.d);
    const parties={};M.forEach(m=>{const c=compare(m);if(!c.shared||!m.p)return;const o=parties[m.p]=parties[m.p]||{a:0,s:0,c:m.c};o.a+=c.agree;o.s+=c.shared;});
    const plist=Object.entries(parties).filter(([p,o])=>o.s>=8).sort((a,b)=>b[1].a/b[1].s-a[1].a/a[1].s);
    const extra=SB.filter(S=>wt(S.k)>0&&S.proposals.some(p=>ans[p.k]==null));
    const row=x=>`<button class="mp" data-mp="${x.m.i}"><i style="background:${x.m.c}"></i><span class="nm">${esc(x.m.n)} <span class="meta">${esc(x.m.p)}</span></span><b>${x.agree} of ${x.shared}</b><small>agree on ${x.agree}, disagree on ${x.disagree}</small></button>`;
    const NN=nearest(),dmax=NN[NN.length-1].d,pnear=SP.parties.filter(p=>p.n>=4&&p.p!=="Ind").map(p=>({...p,d:dist([p.x,p.y,p.z],z)})).sort((a,b)=>a.d-b.d);
    R.innerHTML=`<p class="big">Your nearest MP is ${esc(NN[0].m.n)} <span style="color:${NN[0].m.c}">(${esc(NN[0].m.p)})</span>. The nearest party average is ${esc(full(pnear[0].p))}.</p>
    <p class="meta">From ${done.length} answer${done.length>1?"s":""}, you're placed in the same learned space as every MP; these are your nearest neighbours in it. The dashed circle shows how sure your spot is; more answers shrink it.</p>
    <div><h3>Closest to you in the space</h3>${NN.slice(0,8).map((x,i)=>`<button class="near" data-mp="${x.m.i}"><span class="k">${i+1}</span><i style="background:${x.m.c}"></i><span class="nm">${esc(x.m.n)} <span class="meta">${esc(x.m.p)}</span></span><span class="k" style="text-align:right">${x.d.toFixed(2)} away</span></button>`).join("")}</div>
    <div><h3>Party averages, nearest first</h3>${pnear.map(p=>`<div class="party"><span>${esc(p.p)}</span><div class="bar"><i style="width:${Math.max(3,(1-p.d/dmax)*100)}%;background:${PCOL[p.p]}"></i></div><span class="meta num">${p.d.toFixed(2)}</span></div>`).join("")}</div>
    ${available()?`<div class="row"><button class="btn" data-go="more8">Sharpen it: ${Math.min(LEN,available())} more questions</button></div>`:""}
    ${extra.length?`<div><h3>Or pick a subject</h3><div class="more">${extra.map(S=>`<button data-more="${S.k}">${esc(S.title)} (${S.proposals.filter(p=>ans[p.k]==null).length})</button>`).join("")}</div></div>`:""}
    <details><summary class="meta" style="cursor:pointer">Answer by answer: who agrees with you most often</summary><div style="display:flex;flex-direction:column;gap:12px;margin-top:8px">
    <div><h3>MPs who most often said what you'd say</h3>${rk.slice(0,6).map(row).join("")}</div>
    <div><h3>Parties, by share of positions that match yours</h3>${plist.map(([p,o])=>`<div class="party"><span>${esc(p)}</span><div class="bar"><i style="width:${Math.round(o.a/o.s*100)}%;background:${o.c}"></i></div><span class="meta num">${o.a} of ${o.s}</span></div>`).join("")}</div>
    <div><h3>MPs who most often said the opposite</h3>${rk.slice(-4).reverse().map(row).join("")}</div></div></details>
    <details><summary class="meta" style="cursor:pointer">Your answers</summary>${P.filter(p=>ans[p.k]!=null).map(p=>`<button class="ans" data-q="${p.k}"><span>${esc(p.label)}</span><span class="meta">${({"1":"Support","-1":"Oppose","0.5":"With conditions","u":"Skipped"})[ans[p.k]]}</span></button>`).join("")}</details>
    <div class="row"><button class="link" data-go="care">Who talks about what I care about?</button><button class="link" data-go="reset">Start again</button></div>`;}
  paint();}
function next(){if(qi<Q.length-1){qi++;}else{const p=adaptive&&Q.length<TOTAL&&pickNext();if(p){Q.push(p);qi++;}else{view="results";}}render();}
function startAdaptive(){Q=[];adaptive=true;TOTAL=Math.min(LEN,available());const p=pickNext();if(!p){view="results";render();return;}Q=[p];qi=0;view="quiz";render();}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const g=b.dataset.go;
  if(b.dataset.dim){setDim(+b.dataset.dim);}
  else if(b.dataset.a!=null){ans[Q[qi].k]=b.dataset.a;save();document.querySelectorAll(".ch").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));paint();setTimeout(next,450);}
  else if(b.dataset.imp){imp[b.dataset.imp]=b.dataset.v;save();render();}
  else if(b.dataset.mp){sel=+b.dataset.mp;view="detail";render();if(innerWidth<=860)$("panel").scrollIntoView({behavior:"smooth"});}
  else if(b.dataset.q){Q=[byK[b.dataset.q]];adaptive=false;TOTAL=1;qi=0;view="quiz";sel=null;render();}
  else if(b.dataset.more){Q=P.filter(p=>p.s.k===b.dataset.more&&ans[p.k]==null);adaptive=false;TOTAL=Q.length;qi=0;view="quiz";render();}
  else if(g==="care"||b.dataset.mode==="care"){mode="care";view="care";sel=null;render();}
  else if(g==="stand"||b.dataset.mode==="stand"){mode="stand";sel=null;if(answered().length&&g!=="stand"||!available())view="results",render();else startAdaptive();}
  else if(g==="back"){sel=null;view=mode==="care"?"care":"results";render();}
  else if(g==="core"||g==="more8"){startAdaptive();}
  else if(g==="prev"){qi=Math.max(0,qi-1);render();}
  else if(g==="results"){view="results";sel=null;render();}
  else if(g==="reset"){ans={};imp={};save();view="intro";sel=null;render();}
  else if(g==="checks")$("checks").scrollIntoView({behavior:"smooth"});});
document.addEventListener("keydown",e=>{if(view!=="quiz")return;const m={"1":0,"2":1,"3":2,"4":3}[e.key];if(m!=null)document.querySelectorAll(".ch")[m].click();});


addEventListener("resize",size);size();setDim(2);render();requestAnimationFrame(tick);
</script>
</body>
