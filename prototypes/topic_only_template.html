<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Commons Topic Space</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: the screen is one shared sky of subjects over Commons-bench green; quiet controls float at the edges. */
:root{--bench:#0a211b;--bench2:#143a30;--ink:#efece0;--dim:#a7b8ae;--brass:#d9b45f;--line:#2c5145;--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Source Sans 3","Segoe UI",sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bench);color:var(--ink);font:15px/1.4 var(--body);overflow:hidden;margin:0}
#stage{position:fixed;left:0;top:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;background:none;border:0;padding:1px 4px;color:var(--ink);white-space:nowrap;text-shadow:0 0 4px var(--bench),0 0 9px var(--bench),0 1px 2px #000;will-change:transform}
.rl{font:700 15px/1.1 var(--display)}
.tl{font:500 12px/1.1 var(--body)}
.tl:hover,.tl.on{color:var(--brass)}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
header{position:fixed;left:max(16px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));width:min(270px,calc(100vw - 32px));display:flex;flex-direction:column;gap:9px;pointer-events:none}
header>*{pointer-events:auto}
h1{font:700 24px/1.05 var(--display);margin:0;text-wrap:balance}
.sub{color:var(--dim);margin:0;font-size:13.5px}
#searchwrap{position:relative}
#search{width:100%;box-sizing:border-box;background:var(--bench2);border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:6px;font:inherit}
#results{position:absolute;z-index:5;left:0;right:0;top:100%;margin:2px 0 0;padding:0;list-style:none;background:var(--bench2);border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto}
#results button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;padding:5px 10px;cursor:pointer}
#results button:hover{background:var(--line)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{background:var(--bench2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 9px;font:13px var(--body);cursor:pointer}
.tool:hover{border-color:var(--brass)}
#panel{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:330px;background:color-mix(in srgb,var(--bench2) 94%,transparent);border:1px solid var(--line);border-radius:10px;padding:16px;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:13px}
#panel h2{font:700 21px/1.1 var(--display);margin:0;text-wrap:balance}
#panel h3{font:600 11.5px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 5px}
#panel p{margin:0}
.meta{color:var(--dim);font-size:13.5px}
.words{font-size:13.5px}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:7px;align-items:center;background:none;border:0;color:var(--ink);font:13.5px var(--body);padding:3px 0;cursor:pointer;text-align:left}
.row:hover{color:var(--brass)}
.row i{width:9px;height:9px;border-radius:2px;flex:none}
.row small{color:var(--dim)}
blockquote{margin:0 0 3px;font-size:14px}
.src{color:var(--dim);font-size:12.5px;margin-bottom:9px}
@media (max-width:760px){h1{font-size:19px}.sub{display:none}#panel{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:auto;max-height:42%}.rl{font-size:12.5px}.tl{font-size:10.5px}}
</style>
</head>
<body>
<canvas id="stage" aria-label="3D map of subjects discussed in the House of Commons. Use search to find a topic."></canvas>
<div id="labels"></div>
<header>
  <h1>Commons Topic Space</h1>
  <p class="sub">Every star is a passage of speech. Nearby topics use similar words or come up in the same debates. There are no MPs or parties here. Drag to turn, scroll to zoom, click a name.</p>
  <div id="searchwrap"><input id="search" type="search" placeholder="Find a topic, such as asylum" autocomplete="off" aria-label="Find a topic"><ul id="results" hidden></ul></div>
  <div class="tools"><button class="tool" id="zin">Zoom in</button><button class="tool" id="zout">Zoom out</button><button class="tool" id="reset">Reset view</button><button class="tool" id="spin">Pause spin</button><button class="tool" id="tlabels">Hide topic names</button></div>
</header>
<aside id="panel"></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const D=__DATA__;
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const XYZ=new Int16Array(bytes("__XYZ__").buffer),ST=bytes("__TOPIC__");
const T=D.topics,R=D.regions,S=ST.length;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const hue=r=>Math.round((r*137.508)%360);
const regionColour=R.map((_,r)=>`hsl(${hue(r)}, 78%, ${r%2?72:64}%)`);
const canvas=$("stage");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
const DPR=Math.min(devicePixelRatio,2);renderer.setPixelRatio(DPR);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0a211b);
const camera=new THREE.PerspectiveCamera(50,1,.1,300);
const pos=new Float32Array(S*3),col=new Float32Array(S*3),bright=new Float32Array(S);
const rc=R.map((_,r)=>new THREE.Color(regionColour[r]));
const grey=new THREE.Color(0x6f7f79);
for(let i=0;i<S;i++){for(let j=0;j<3;j++)pos[i*3+j]=XYZ[i*3+j]/32767*D.limit;const t=T[ST[i]],c=t.catchall?grey:rc[t.r];col.set([c.r,c.g,c.b],i*3);bright[i]=t.catchall?.4:.8;}
const geo=new THREE.BufferGeometry();
geo.setAttribute("position",new THREE.BufferAttribute(pos,3));geo.setAttribute("col",new THREE.BufferAttribute(col,3));geo.setAttribute("bright",new THREE.BufferAttribute(bright,1));
const uni={px:{value:1}};
const stars=new THREE.Points(geo,new THREE.ShaderMaterial({uniforms:uni,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
vertexShader:`attribute vec3 col;attribute float bright;uniform float px;varying vec3 vC;varying float vB;void main(){vC=col;vB=bright;vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=max(1.5,px*(.55+bright*.8)/-mv.z);}`,
fragmentShader:`varying vec3 vC;varying float vB;void main(){float d=length(gl_PointCoord-.5);if(d>.5)discard;float a=smoothstep(.5,.05,d);gl_FragColor=vec4(vC*a*vB*.8,a);}`}));
stars.frustumCulled=false;scene.add(stars);
const lGeo=new THREE.BufferGeometry();const lines=new THREE.LineSegments(lGeo,new THREE.LineBasicMaterial({color:0xd9b45f,transparent:true,opacity:.55}));lines.visible=false;scene.add(lines);
const tv=T.map(t=>new THREE.Vector3(...t.x)),rv=R.map(r=>new THREE.Vector3(...r.x));
const tName=t=>cap(t.name.join(", "));
const tEls=T.map((t,k)=>{const b=document.createElement("button");b.className="lb tl";b.textContent=tName(t);b.onclick=()=>selectTopic(k);$("labels").append(b);return b;});
const rEls=R.map((r,k)=>{const b=document.createElement("button");b.className="lb rl";b.textContent=cap(r.name.join(", "));b.style.color=regionColour[k];b.onclick=()=>selectRegion(k);$("labels").append(b);return b;});
const HOME=40;let az=.6,el=.28,dist=HOME,distTo=HOME,target=new THREE.Vector3(),targetTo=new THREE.Vector3(),spin=!reduce,topicSel=null,regionSel=null,showT=true;
const v=new THREE.Vector3();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(w>760)camera.setViewOffset(w,h,165,0,w,h);else camera.clearViewOffset();uni.px.value=h*DPR/(2*Math.tan(25*Math.PI/180))*.075;}
addEventListener("resize",resize);resize();
const project=p=>{v.copy(p).project(camera);return{x:(v.x+1)/2*innerWidth,y:(1-v.y)/2*innerHeight,z:v.z};};
function refresh(){for(let i=0;i<S;i++){const t=T[ST[i]];let b=t.catchall?.4:.8;if(topicSel!=null)b=ST[i]===topicSel?2:(T[topicSel].near.includes(ST[i])?1:.05);else if(regionSel!=null)b=t.r===regionSel?1.2:.05;bright[i]=b;}geo.attributes.bright.needsUpdate=true;
  if(topicSel!=null){const a=[];T[topicSel].near.forEach(j=>a.push(...T[topicSel].x,...T[j].x));lGeo.setAttribute("position",new THREE.Float32BufferAttribute(a,3));lines.visible=true;}else lines.visible=false;}
const panel=$("panel");
const row=(k,extra="")=>`<button class="row" data-t="${k}"><i style="background:${T[k].catchall?"#6f7f79":regionColour[T[k].r]}"></i><span>${esc(tName(T[k]))}${extra?` <small>${esc(extra)}</small>`:""}</span></button>`;
function wire(){panel.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>selectTopic(+b.dataset.t));panel.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>selectRegion(+b.dataset.r));const c=$("back");if(c)c.onclick=clearAll;panel.scrollTop=0;}
const back=`<button class="tool" id="back" style="align-self:flex-end;margin-bottom:-8px">Back to the full map</button>`;
function intro(){const order=R.map((r,k)=>[r,k]).sort((a,b)=>b[0].size-a[0].size);panel.innerHTML=`<div><h3>What you're looking at</h3><h2>${T.length} topics in ${R.length} neighbourhoods</h2></div>
<p>${(D.stats.passages/1000).toFixed(0)}k passages from ${D.stats.debates.toLocaleString()} Commons debates since July 2024. Nobody told it what the subjects are. Every name on the map is the data's own most distinctive words.</p>
<div><h3>Neighbourhoods</h3><div class="list">${order.map(([r,k])=>`<button class="row" data-r="${k}"><i style="background:${regionColour[k]}"></i><span>${esc(cap(r.name.join(", ")))} <small>${r.size}</small></span></button>`).join("")}</div></div>
<div><h3>How far to trust it</h3><p class="meta">Topics are related through shared words and appearing in the same debates. Map distance matches that with a rank correlation of ${D.stats.map_corr}, so nearer generally means more related, though 3D can't hold everything. Topic links from separate halves of the debates correlate at ${D.stats.half_corr}. Grey clouds are loose catch-all groups rather than clear subjects. The exact position of a star inside a cloud means nothing.</p></div>`;wire();}
function selectTopic(k){topicSel=k;regionSel=null;spin=false;syncSpin();targetTo.copy(tv[k]);distTo=Math.min(distTo,17);const t=T[k];
  panel.innerHTML=`${back}<div><h3 style="color:${regionColour[t.r]}">${esc(cap(R[t.r].name.join(", ")))}</h3><h2>${esc(tName(t))}</h2><div class="meta">${t.n.toLocaleString()} passages${t.catchall?". A loose catch-all group, not a clear subject.":""}</div></div>
<div><h3>Its most distinctive words</h3><div class="words">${t.words.map(esc).join(" · ")}</div></div>
<div><h3>Nearest topics</h3><div class="list">${t.near.map(j=>row(j)).join("")}</div></div>
<div><h3>Debates where it comes up most</h3><div class="meta">${t.heads.map(esc).join("<br>")}</div></div>
<div><h3>Passages closest to its centre</h3>${t.ex.map(e=>`<blockquote>${esc(e.t)}</blockquote><div class="src">${esc(e.h)}, ${esc(e.d)}</div>`).join("")}</div>`;wire();refresh();}
function selectRegion(k){regionSel=k;topicSel=null;spin=false;syncSpin();targetTo.copy(rv[k]);distTo=Math.min(distTo,20);const list=T.map((t,i)=>[t,i]).filter(([t])=>t.r===k).sort((a,b)=>b[0].n-a[0].n);
  panel.innerHTML=`${back}<div><h3 style="color:${regionColour[k]}">Neighbourhood</h3><h2>${esc(cap(R[k].name.join(", ")))}</h2></div><div><h3>Topics here</h3><div class="list">${list.map(([t,i])=>row(i,t.n.toLocaleString())).join("")}</div></div>`;wire();refresh();}
function clearAll(){topicSel=null;regionSel=null;targetTo.set(0,0,0);distTo=HOME;intro();refresh();}
const search=$("search"),results=$("results");
search.oninput=()=>{const q=search.value.trim().toLowerCase();if(q.length<2){results.hidden=true;return;}const hit=T.map((t,i)=>[t,i]).filter(([t])=>t.words.some(w=>w.includes(q))).slice(0,8);results.innerHTML=hit.length?hit.map(([t,i])=>`<li><button data-t="${i}">${esc(tName(t))}</button></li>`).join(""):`<li style="padding:5px 10px" class="meta">No topic has that among its top words.</li>`;results.hidden=false;results.querySelectorAll("button").forEach(b=>b.onclick=()=>{selectTopic(+b.dataset.t);results.hidden=true;search.value="";});};
function syncSpin(){$("spin").textContent=spin?"Pause spin":"Spin";}
$("reset").onclick=clearAll;$("spin").onclick=()=>{spin=!spin;syncSpin();};syncSpin();
$("zin").onclick=()=>{distTo=Math.max(3,distTo*.72);};$("zout").onclick=()=>{distTo=Math.min(80,distTo/.72);};
$("tlabels").onclick=e=>{showT=!showT;e.target.textContent=showT?"Hide topic names":"Show topic names";};
addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;const k=e.key;if(k==="Escape")clearAll();else if(k==="ArrowLeft"){az-=.12;spin=false;syncSpin();}else if(k==="ArrowRight"){az+=.12;spin=false;syncSpin();}else if(k==="ArrowUp")el=Math.min(1.45,el+.1);else if(k==="ArrowDown")el=Math.max(-1.45,el-.1);else if(k==="+"||k==="=")distTo=Math.max(3,distTo*.8);else if(k==="-")distTo=Math.min(80,distTo/.8);});
const pointers=new Map();let moved=0,pinch=0;
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);moved=0;canvas.classList.add("drag");});
canvas.addEventListener("pointermove",e=>{if(!pointers.has(e.pointerId))return;const[px,py]=pointers.get(e.pointerId);const dx=e.clientX-px,dy=e.clientY-py;pointers.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);if(pointers.size===1){az-=dx*.006;el=Math.max(-1.45,Math.min(1.45,el+dy*.006));if(moved>5){spin=false;syncSpin();}}else if(pointers.size===2){const[a,b]=[...pointers.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pinch)distTo=Math.max(3,Math.min(80,distTo*pinch/d));pinch=d;}});
const up=e=>{pointers.delete(e.pointerId);pinch=0;canvas.classList.remove("drag");};canvas.addEventListener("pointerup",up);canvas.addEventListener("pointercancel",up);
canvas.addEventListener("wheel",e=>{e.preventDefault();distTo=Math.max(3,Math.min(80,distTo*Math.exp(e.deltaY*.0012)));},{passive:false});
function place(b,p,o){const off=p.z>1||o<=.01;b.style.display=off?"none":"";if(off)return;b.style.opacity=o;b.style.pointerEvents=o<.25?"none":"auto";b.style.transform=`translate(${Math.round(p.x)}px,${Math.round(p.y)}px) translate(-50%,-50%)`;}
function frame(){requestAnimationFrame(frame);if(spin)az+=.0013;target.lerp(targetTo,.08);dist+=(distTo-dist)*.08;
  camera.position.set(target.x+dist*Math.cos(el)*Math.sin(az),target.y+dist*Math.sin(el),target.z+dist*Math.cos(el)*Math.cos(az));camera.lookAt(target);camera.updateMatrixWorld();
  T.forEach((t,k)=>{const depth=camera.position.distanceTo(tv[k]);let o=showT?Math.max(0,Math.min(.95,(28-depth)/9)):0;if(topicSel!=null)o=k===topicSel||T[topicSel].near.includes(k)?1:0;else if(regionSel!=null)o=t.r===regionSel?1:0;else if(t.catchall)o*=.5;tEls[k].classList.toggle("on",k===topicSel);place(tEls[k],project(tv[k]),o);});
  R.forEach((r,k)=>{const depth=camera.position.distanceTo(rv[k]);let o=Math.max(.5,Math.min(1,1.4-depth/(dist*1.5)));if(topicSel!=null)o=.15;else if(regionSel!=null)o=k===regionSel?0:.25;else if(dist<18)o=Math.min(o,.45);place(rEls[k],project(rv[k]),o);});
  renderer.render(scene,camera);}
intro();refresh();frame();
</script>
</body>
</html>
