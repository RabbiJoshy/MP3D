<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Commons Fault Lines</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: a working desk in Commons-bench green. Topics on the left, the chart in the middle, evidence on the right. */
:root{--bench:#0a211b;--bench2:#143a30;--bench3:#1b463a;--ink:#efece0;--dim:#a7b8ae;--brass:#d9b45f;--line:#2c5145;--strong:#8fd694;--moderate:#d9b45f;--weak:#7d8c86;--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Source Sans 3","Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bench);color:var(--ink);font:15px/1.4 var(--body)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;height:100%;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
aside,main{min-width:0;min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--line);padding:14px 12px 0;gap:8px}
#right{border-left:1px solid var(--line);padding:14px;gap:13px;overflow:auto}
main{padding:14px 16px;gap:8px}
h1{font:700 23px/1.05 var(--display);margin:0}
h2{font:700 22px/1.1 var(--display);margin:0;text-wrap:balance}
h3{font:600 11.5px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--brass);margin:0 0 5px}
p{margin:0}
.sub,.meta{color:var(--dim);font-size:13.5px}
input{width:100%;background:var(--bench2);border:1px solid var(--line);color:var(--ink);padding:7px 10px;border-radius:6px;font:inherit}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,circle:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#topics{overflow:auto;flex:1;margin:0 -4px;padding:0 4px 12px;display:flex;flex-direction:column}
.t{display:grid;grid-template-columns:10px minmax(0,1fr);gap:7px;align-items:baseline;background:none;border:0;text-align:left;padding:4px 5px;border-radius:5px;cursor:pointer;font-size:13.5px}
.t:hover{background:var(--bench2)}
.t[aria-current=true]{background:var(--bench3);color:var(--brass)}
.t i,.g{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.strong{background:var(--strong)}.moderate{background:var(--moderate)}.weak{background:transparent;border:1.5px solid var(--weak)}
.head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bench2);border:1px solid var(--line);border-radius:999px;font-size:12.5px;padding:2px 8px;cursor:pointer}
.chip i{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed=true]{border-color:var(--brass);color:var(--brass)}
#chartwrap{flex:1;min-height:320px;position:relative}
svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.endx,.endy{position:absolute;font-size:13px;line-height:1.2;color:var(--ink);pointer-events:none}
.endx{bottom:2px;max-width:42%}
#xlo{left:0}#xhi{right:0;text-align:right}
.endy{left:50%;transform:translateX(-50%);text-align:center;max-width:60%;background:color-mix(in srgb,var(--bench) 80%,transparent);padding:0 4px}
#yhi{top:0}#ylo{bottom:24px}
.endx b,.endy b{display:block;font:600 10.5px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--brass)}
#tip{position:fixed;display:none;pointer-events:none;background:var(--bench2);border:1px solid var(--line);padding:3px 8px;border-radius:5px;font-size:13px;left:0;top:0;white-space:nowrap;z-index:5}
.who{display:flex;gap:12px;align-items:center}
.face{width:72px;height:72px;border-radius:50%;flex:none;border:3px solid;background-repeat:no-repeat}
blockquote{margin:0 0 3px;font-size:14px}
.src{color:var(--dim);font-size:12.5px;margin-bottom:9px}
.link{background:none;border:0;padding:0;color:var(--brass);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:7px;background:none;border:0;padding:3px 0;font-size:13.5px;text-align:left;cursor:pointer}
.row:hover{color:var(--brass)}
#mpresults{list-style:none;margin:0;padding:0;background:var(--bench2);border:1px solid var(--line);border-radius:6px;max-height:190px;overflow:auto;position:absolute;left:0;right:0;z-index:4}
#mpresults button{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 9px;cursor:pointer;font-size:13.5px}
#mpresults button:hover{background:var(--line)}
@media (max-width:980px){html,body{height:auto}.app{display:flex;flex-direction:column;height:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}#left{border:0;padding:12px 0}#topics{max-height:190px}main{padding:6px 0}#chartwrap{height:66vh;flex:none}#right{border:0;padding:12px 0;overflow:visible}}
</style>
</head>
<body>
<div class="app">
<aside id="left">
  <h1>Commons Fault Lines</h1>
  <p class="sub">What MPs differ on most in each subject, found from their speeches with no labels.</p>
  <input id="tsearch" type="search" placeholder="Find a topic" aria-label="Find a topic" autocomplete="off">
  <p class="meta"><span class="g strong"></span> strong <span class="g moderate"></span> moderate <span class="g weak"></span> weak</p>
  <div id="topics"></div>
</aside>
<main>
  <div class="head"><h2 id="title"></h2><div style="position:relative;width:min(230px,100%)"><input id="mpsearch" type="search" placeholder="Follow an MP" aria-label="Follow an MP across topics" autocomplete="off"><ul id="mpresults" hidden></ul></div></div>
  <div class="chips" id="chips"></div>
  <div id="chartwrap"><svg id="chart" role="img" aria-label="MPs placed on this topic's two main axes"></svg><div class="endy" id="yhi"></div><div class="endy" id="ylo"></div><div class="endx" id="xlo"></div><div class="endx" id="xhi"></div></div>
</main>
<aside id="right"></aside>
</div>
<div id="tip"></div>
<script>
const D=__DATA__;const ATLAS="__ATLAS__";
const T=D.topics,M=D.mps;const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const name=t=>cap(t.name.join(", "));
let cur=0,sel=null,solo=null;
const rank={strong:0,moderate:1,weak:2};
const order=T.map((t,i)=>i).sort((a,b)=>rank[T[a].axes[0].grade]-rank[T[b].axes[0].grade]||T[b].mps-T[a].mps);
function drawTopics(q=""){const box=$("topics");box.innerHTML="";order.filter(i=>{const t=T[i];return !q||t.words.some(w=>w.includes(q))||t.axes[0].lo.concat(t.axes[0].hi).some(w=>w.includes(q));}).forEach(i=>{const b=document.createElement("button");b.className="t";b.setAttribute("aria-current",i===cur);b.innerHTML=`<i class="${T[i].axes[0].grade}"></i><span>${esc(name(T[i]))}</span>`;b.onclick=()=>{cur=i;render();};box.append(b);});}
$("tsearch").oninput=e=>drawTopics(e.target.value.trim().toLowerCase());
const parties=Object.entries(M.reduce((a,m)=>{(a[m.p]=a[m.p]||{n:0,c:m.c}).n++;return a;},{})).sort((a,b)=>b[1].n-a[1].n);
parties.forEach(([p,o])=>{if(o.n<2)return;const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed","false");b.innerHTML=`<i style="background:${o.c}"></i>${esc(p)}`;b.onclick=()=>{solo=solo===p?null:p;document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));if(solo)b.setAttribute("aria-pressed","true");drawChart();};$("chips").append(b);});
const NS="http://www.w3.org/2000/svg";
function drawChart(){const svg=$("chart"),w=svg.clientWidth,h=svg.clientHeight,t=T[cur],pad=26,bottom=56;svg.setAttribute("viewBox",`0 0 ${w} ${h}`);svg.innerHTML="";
  const X=v=>pad+(Math.max(-1.25,Math.min(1.25,v))+1.25)/2.5*(w-2*pad),Y=v=>pad+(1.25-Math.max(-1.25,Math.min(1.25,v)))/2.5*(h-pad-bottom);
  const line=(x1,y1,x2,y2)=>{const l=document.createElementNS(NS,"line");l.setAttribute("x1",x1);l.setAttribute("y1",y1);l.setAttribute("x2",x2);l.setAttribute("y2",y2);l.setAttribute("stroke","#2c5145");svg.append(l);};
  line(pad,Y(0),w-pad,Y(0));line(X(0),pad,X(0),h-bottom);
  const pts=t.pts.slice().sort((a,b)=>(a[0]===sel)-(b[0]===sel));
  pts.forEach(([m,x,y,n])=>{const mp=D.byId[m];if(!mp)return;const c=document.createElementNS(NS,"circle");c.setAttribute("cx",X(x));c.setAttribute("cy",Y(y));const r=3.2+Math.min(4,Math.sqrt(n)*.65);c.setAttribute("r",m===sel?r+4:r);c.setAttribute("fill",mp.c);const dim=(solo&&mp.p!==solo)||(sel!=null&&m!==sel&&false);c.setAttribute("fill-opacity",dim?.1:.82);c.setAttribute("stroke",m===sel?"#efece0":"#0a211b");c.setAttribute("stroke-width",m===sel?2.5:.8);c.setAttribute("tabindex",0);c.setAttribute("aria-label",`${mp.n}, ${mp.p}`);c.style.cursor="pointer";
    c.onmousemove=e=>{const tip=$("tip");tip.textContent=`${mp.n} · ${mp.p}`;tip.style.display="block";tip.style.transform=`translate(${Math.min(e.clientX+12,innerWidth-220)}px,${e.clientY+12}px)`;};c.onmouseleave=()=>{$("tip").style.display="none";};c.onclick=()=>{sel=m;drawChart();panel();};c.onkeydown=e=>{if(e.key==="Enter"){sel=m;drawChart();panel();}};svg.append(c);});
  const ends=(id,label,words)=>{$(id).innerHTML=`<b>${label}</b>${esc(words.slice(0,4).join(", "))}`;};
  const a=t.axes;ends("xlo","Axis 1",a[0].lo);ends("xhi","Axis 1",a[0].hi);ends("ylo","Axis 2",a[1].lo);ends("yhi","Axis 2",a[1].hi);}
function faceStyle(id){const i=D.tiles[id];const s=72/D.tile;if(i==null)return "";return `background-image:url(${ATLAS});background-size:${D.size*s}px;background-position:-${(i%D.cols)*D.tile*s}px -${Math.floor(i/D.cols)*D.tile*s}px;border-color:${D.byId[id].c}`;}
const gradeText={strong:"Strong: MPs land in similar places when this axis is rebuilt from separate debates, and it clearly beats shuffled speakers.",moderate:"Moderate: there's some stability across separate debates, so read it with care.",weak:"Weak: this is the widest difference found, but it could be noise."};
function panel(){const t=T[cur],a=t.axes,p=$("right");let h="";
  if(sel!=null&&D.byId[sel]){const m=D.byId[sel],q=t.quotes[sel],pt=t.pts.find(x=>x[0]===sel);
    h+=`<div><div class="who"><div class="face" style="${faceStyle(sel)}"></div><div><h2>${esc(m.n)}</h2><div class="meta">${esc(m.pn)}<br>${esc(m.k||"")}</div></div></div><p style="margin-top:6px"><button class="link" id="clear">Stop following</button></p></div>`;
    h+=pt?`<div><h3>In this topic</h3><blockquote>${esc(q?q.t:"")}</blockquote><div class="src">${q?`${esc(q.h)}, ${esc(q.d)}`:""}. ${pt[3]} speeches here.</div></div>`:`<div><h3>In this topic</h3><p class="meta">Not placed: there isn't enough speech from this MP here outside any government post. That isn't the same as having no view.</p></div>`;
    const mine=T.map((x,i)=>[x,i,x.pts.find(y=>y[0]===sel)]).filter(z=>z[2]).sort((x,y)=>y[2][3]-x[2][3]).slice(0,8);
    h+=`<div><h3>Their most-spoken topics</h3><div class="list">${mine.map(([x,i,y])=>`<button class="row" data-go="${i}">${esc(name(x))} <span class="meta">${y[3]}</span></button>`).join("")}</div></div>`;}
  h+=`<div><h3>What this shows</h3><p class="meta">${t.mps} MPs with enough speech. Party explains ${Math.round(a[0].party*100)}% of the first axis. These axes show how MPs talk about this subject differently, which isn't always disagreement, so read the words at each end and the passages.</p></div>`;
  [0,1].forEach(d=>{const x=a[d];h+=`<div><h3>Axis ${d+1} <span class="g ${x.grade}"></span></h3><p class="meta">${gradeText[x.grade]} Separate debates: ${x.held??"n/a"}. Variation ${(x.var/x.null).toFixed(2)}× chance.</p>
   <p style="margin-top:6px"><b>One end:</b> ${esc(x.lo.slice(0,7).join(", "))}</p>${x.ex_lo.map(e=>`<blockquote style="margin-top:5px">${esc(e.t)}</blockquote><div class="src">${esc((D.byId[e.m]||{}).n||"")}, ${esc(e.h)}, ${esc(e.d)}</div>`).join("")}
   <p style="margin-top:6px"><b>Other end:</b> ${esc(x.hi.slice(0,7).join(", "))}</p>${x.ex_hi.map(e=>`<blockquote style="margin-top:5px">${esc(e.t)}</blockquote><div class="src">${esc((D.byId[e.m]||{}).n||"")}, ${esc(e.h)}, ${esc(e.d)}</div>`).join("")}</div>`;});
  h+=`<p class="meta">Built from ${D.stats.passages.toLocaleString()} backbench and opposition passages since July 2024. Ministers' speech is left out, so most frontbench Government MPs aren't placed. Topic names and axis ends are the data's own words.</p>`;
  p.innerHTML=h;p.scrollTop=0;const c=$("clear");if(c)c.onclick=()=>{sel=null;render();};p.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{cur=+b.dataset.go;render();});}
function render(){$("title").textContent=name(T[cur]);drawTopics($("tsearch").value.trim().toLowerCase());drawChart();panel();}
const mps=$("mpsearch"),mpr=$("mpresults");
mps.oninput=()=>{const q=mps.value.trim().toLowerCase();if(q.length<2){mpr.hidden=true;return;}const hit=M.filter(m=>m.n.toLowerCase().includes(q)||(m.k||"").toLowerCase().includes(q)).slice(0,8);mpr.innerHTML=hit.length?hit.map(m=>`<li><button data-i="${m.i}">${esc(m.n)} <span class="meta">${esc(m.p)}</span></button></li>`).join(""):`<li style="padding:5px 9px" class="meta">No MP matches that.</li>`;mpr.hidden=false;mpr.querySelectorAll("button").forEach(b=>b.onclick=()=>{sel=+b.dataset.i;mps.value="";mpr.hidden=true;render();});};
addEventListener("resize",drawChart);
cur=Math.max(0,T.findIndex(t=>t.words.includes("gaza")));render();
</script>
</body>
</html>
